name: Osman Teknik Pro CI

on:
  push:
    branches: ["main", "mobile-pwa", "feature/akilli-kamera-pos"]
  pull_request:
    branches: ["main"]

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Type check
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
